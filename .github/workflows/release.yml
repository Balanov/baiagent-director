name: test-and-release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            command: npm run dist:win
            artifact: windows
            files: |
              release/*.exe
              release/latest.yml
          - os: windows-latest
            command: npm run dist:win:enterprise
            artifact: windows-enterprise
            files: |
              release-enterprise/*.exe
              release-enterprise/latest.yml
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
          - os: macos-latest
            command: npm run dist:mac
            artifact: macos
            files: |
              release/*.dmg
              release/*.zip
              release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Package desktop application
        if: github.ref != 'refs/tags/v1.2.0' || matrix.artifact != 'windows-enterprise'
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/tags/v1.2.0' || matrix.artifact != 'windows-enterprise'
        with:
          name: baiagent-director-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      # Release 1.2.0 publishes the separately verified CI artifact without replacing its checksum.
      - name: Attach artifacts to tagged release
        if: startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/tags/v1.2.0'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
